# Answer key for incident 001. Spec section 8.7.
#
# This file is read by eval/grade.py only. Nothing in agent/, indexer/, ledger/ or tools/
# may read it, and tests/test_no_incident_leakage.py enforces that.

id: 001_silent_write_redirect
class: D            # cross-team change with latent consumer weakness

causes:             # BOTH required. Naming one scores zero.
  - repo: platform-config
    path: overlays/prod/orders.yaml
    ts: "2026-08-20T09:34:00"
    change: renamed ORDERS_TABLE to ORDERS_TABLE_NAME
    team: Platform
  - repo: platform-iac
    path: modules/iam/dynamodb.tf
    ts: "2026-08-20T09:12:00"
    change: resource ARN widened from orders-prod to orders-*
    team: Platform

symptom:
  metric: orders_created
  drop_pct: 94
  error_rate_change: 0        # this is what makes it silent

must_not_stop_at:   # terminating here is an automatic fail
  - "orders-api writing to the wrong table"
  - "ORDERS_TABLE environment variable missing"
  - "code fell back to a hardcoded default"

must_flag:
  security: "IAM wildcard remains live after the functional fix"
  hazard:   "orders-staging 24h TTL; export before reverting"
  ordering: true    # decision package must order the remediation steps

expected_gate_rejections: 3   # per 8.4
verification_tier_min: T1

# --- grading aids ------------------------------------------------------------
# Innocent changes present in the same window. Naming any of these in the cause set is a
# false positive and costs precision (spec 10.2).
distractors:
  - repo: platform-config
    path: overlays/prod/analytics.yaml
    note: "real prod ConfigMap change 16 min before the cause, on the service whose metric broke"
  - repo: analytics-etl
    path: etl/extract.py
    note: "change in the downstream consumer during the window"
  - repo: platform-config
    path: overlays/staging/orders.yaml
    note: "same repo and filename as a cause, wrong overlay"
  - repo: platform-iac
    path: modules/iam/s3.tf
    note: "same repo and module as a cause, unrelated policy"

# Keyword evidence the grader looks for when checking must_flag. Matching is on any of the
# alternatives, case-insensitive, so the agent is graded on substance rather than phrasing.
flag_keywords:
  security: ["wildcard", "orders-*", "over-broad", "overly broad", "re-scope", "rescope"]
  hazard: ["ttl", "24h", "24 hour", "export", "data loss", "destroy"]

# The residue that must remain unexplained after a single-cause claim. If the indexer stops
# producing this anomaly, step 3 of the expected gate trace cannot happen and the incident
# silently stops testing what it exists to test.
required_residue_anomaly:
  entity: orders-api
  kind: write_permitted_to_novel_resource
