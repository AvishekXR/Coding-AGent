# Answer key. Read by eval/grade.py only.

id: 006_write_capacity_saturation
class: F            # saturation or capacity limit with no change at all

causes:
  - repo: null
    source: external
    path: orders-api
    ts: "2026-08-20T09:15:00"
    change: scheduled campaign launch doubled order volume into a fixed write ceiling
    team: null

symptom:
  metric: http_4xx_rate
  drop_pct: 40
  error_rate_change: 40

must_not_stop_at:
  - "writes are being throttled"
  - "provisioned capacity is exceeded"
  - "the write ceiling is too low"
  # There is no culprit commit. These are the four ordinary changes in the window, and an
  # agent that must produce one will produce one of these.
  - "lint: silence an unused-import warning"
  - "docs: link the runbook"
  - "config: quieten staging logs"
  - "iam: bucket tagging for the cost dashboard"

must_flag:
  ordering: false

min_gate_rejections: 1
verification_tier_min: T0

notes: >
  Nobody changed anything. The write ceiling has been the same number for a year and traffic
  grew into it. This class exists to break agents that assume every incident has a culprit
  commit -- the correct terminal is the documented traffic event, and the correct remediation
  is capacity rather than a revert.
