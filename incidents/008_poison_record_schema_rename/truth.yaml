# Answer key. Read by eval/grade.py only.

id: 008_poison_record_schema_rename
class: H            # data-shaped: poison message / malformed record

causes:
  - repo: orders-api
    path: app/publish.py
    ts: "2026-08-20T09:23:00"
    change: published event key renamed from order_id to id, which the consumer cannot parse
    team: Orders

symptom:
  metric: queue_depth
  drop_pct: 0
  error_rate_change: 0

must_not_stop_at:
  # THE point of this class. Every one of these is true and none has an author.
  - "the queue is blocked"
  - "the consumer has halted"
  - "there are poison records in the stream"
  - "queue depth is growing"
  - "the consumer cannot parse the record"

must_flag:
  ordering: false

min_gate_rejections: 1
verification_tier_min: T1

notes: >
  The literal poisoned queue. Terminating there is the archetypal halfway root cause: true,
  and useless. The publisher is entirely healthy throughout -- 201s, normal latency, zero
  errors -- so an agent reasoning from "where are the errors" looks at the consumer and finds
  nothing to fix. The cause is a one-line rename upstream, which is what a person reverts.
