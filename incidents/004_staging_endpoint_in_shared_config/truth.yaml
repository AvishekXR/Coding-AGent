# Answer key. Read by eval/grade.py only.

id: 004_staging_endpoint_in_shared_config
class: C            # cross-repository configuration -- the originating brief's own example

causes:
  - repo: platform-config
    path: overlays/prod/orders.yaml
    ts: "2026-08-20T09:28:00"
    change: PAYMENTS_ENDPOINT pointed at the provider sandbox instead of production
    team: Platform

symptom:
  metric: http_4xx_rate
  drop_pct: 100
  error_rate_change: 100

must_not_stop_at:
  - "payments are being declined"
  - "the sandbox is refusing authorisations"
  - "the payment endpoint is wrong"
  # The failing service's own history is clean; this is what a service-scoped tool finds.
  - "docs: reference ADR-31 in the store module"

must_flag:
  ordering: false

min_gate_rejections: 1
verification_tier_min: T1

distractors:
  - repo: orders-api
    path: app/store.py
    note: "a change inside the failing service, before the symptom, that does nothing"
  - repo: platform-config
    path: overlays/prod/analytics.yaml
    note: "same repo, same overlay directory, real production config change"

notes: >
  Nothing in orders-api changed. The sandbox answers -- that is what makes this hard; a dead
  endpoint would have been obvious. The cause is one line in a repository owned by another
  team that the on-call engineer has probably never opened, and the reverse index is the only
  thing that crosses that boundary.
