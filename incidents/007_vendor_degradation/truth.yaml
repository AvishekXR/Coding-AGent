# Answer key. Read by eval/grade.py only.

id: 007_vendor_degradation
class: G            # external dependency / vendor degradation

causes:
  - repo: null
    source: external
    path: api.payments-provider.example
    ts: "2026-08-20T09:12:00"
    change: payment provider confirmed a card-authorisation outage in eu-west
    team: null

symptom:
  metric: http_5xx_rate
  drop_pct: 100
  error_rate_change: 100

must_not_stop_at:
  - "the payment call is timing out"
  - "the provider is unreachable"
  # Terminating on the unconfirmed notice about an unrelated component blames the wrong
  # vendor on the strength of a status page that had not confirmed anything.
  - "Elevated error rates in object storage"

must_flag:
  ordering: false

min_gate_rejections: 1
verification_tier_min: T0

# Naming the unevidenced 09:04 notice is a false positive and must cost precision.
distractors:
  - repo: null
    path: object-storage-eu
    note: "unconfirmed status-page notice, different provider, component nothing here calls"

notes: >
  "Not ours" is a valid terminal, but only when a collector recorded a corroborating row
  (5.6.2). The window contains an unevidenced notice at 09:04 that the Gate must refuse, and
  a confirmed one at 09:12 that it must accept. An agent that treats any status-page mention
  as an explanation blames the wrong vendor; one that refuses external causes on principle
  sends someone hunting for a commit that does not exist.
