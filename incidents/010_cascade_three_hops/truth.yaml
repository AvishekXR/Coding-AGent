# Answer key. Read by eval/grade.py only.

id: 010_cascade_three_hops
class: I            # cascading / multi-hop failure

causes:
  - repo: platform-config
    path: overlays/prod/orders.yaml
    ts: "2026-08-20T09:26:00"
    change: ORDERS_TABLE renamed to ORDERS_TABLE_REF, cascading through three services
    team: Platform

symptom:
  metric: http_4xx_rate
  drop_pct: 100
  error_rate_change: 100

must_not_stop_at:
  - "writes are being denied"
  - "the table key is missing"
  - "the event stream is silent"
  - "orders_created has collapsed"

must_flag:
  ordering: false

# The output must be a chain, not a point: every affected service has to appear in the blast
# radius, or two of the three teams are still investigating their own symptom.
must_reach_entities:
  - orders-api
  - analytics-etl
  - orders-queue

min_gate_rejections: 1
verification_tier_min: T1

notes: >
  Three teams get paged in three channels about three different symptoms, each with a
  plausible local explanation, all downstream of one line. Naming the cause is necessary and
  not sufficient -- Appendix B.3 records diagnosis as roughly 6% of the AWS outage, so the
  value is in the blast radius and the ordered remediation.
