# Answer key. Read by eval/grade.py only.

id: 009_innocent_codeploy
class: J            # red herrings: an innocent co-occurring deploy

causes:
  - repo: platform-config
    path: overlays/prod/orders.yaml
    ts: "2026-08-20T08:52:00"
    change: ORDERS_TABLE renamed to ORDERS_TABLE_ID, so the service fell back to its default
    team: Platform

symptom:
  metric: http_4xx_rate
  drop_pct: 100
  error_rate_change: 100

must_not_stop_at:
  - "the table key is missing"
  - "writes are being denied"
  # The single most attractive wrong answer in the window.
  - "orders-api v2.14.1: lint pass and dependency bump"
  - "scaled deployment orders-api from 6 to 9 replicas"

must_flag:
  ordering: false

min_gate_rejections: 1
verification_tier_min: T1

distractors:
  - repo: orders-api
    path: app/store.py
    note: "a real deploy of the failing service, by its owning team, four minutes before the symptom, that changes no behaviour"
  - repo: platform-config
    path: overlays/staging/orders.yaml
    note: "same repo and filename as the cause, wrong overlay"
  - repo: platform-iac
    path: modules/iam/s3.tf
    note: "unrelated IAM change in the window"

notes: >
  Targets the over-investigation failure of 1.3 directly. On ITBench, models that investigated
  longer scored worse, because over-investigating agents surface co-occurring mechanisms as
  false positives. Naming the innocent deploy fails; naming it alongside the real cause also
  fails, on precision. The Pruning Rule is what should discard it without investigation.
