# Answer key. Read by eval/grade.py only.

id: 002_validation_tightened
class: A            # same-service code regression -- the baseline

causes:
  - repo: orders-api
    path: app/validate.py
    ts: "2026-08-20T09:20:00"
    change: MAX_ITEMS lowered from 10 to 3
    team: Orders

symptom:
  metric: http_4xx_rate
  drop_pct: 62
  error_rate_change: 62

must_not_stop_at:
  - "orders are being rejected"
  - "the item cap is too low"
  - "validation is failing"

must_flag:
  ordering: false

min_gate_rejections: 1
verification_tier_min: T0

notes: >
  The easy shape: a recent commit in the failing service's own repository, a loud error rate,
  and an error message naming the rule that fired. If this fails, stop and fix the basics --
  the section 11.1 kill criterion.
